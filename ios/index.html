<title>License Plate Hunt for iPhone</title>
<style>:root{--bg:#F2F2F7;--surface:#FFFFFF;--label:#000000;--secondary:#6C6C70;--separator:#E5E5EA;--tint:#007AFF;--link:#0066D6;--link-hover:#0052AB;--chevron:#C7C7CC;--font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Inter,system-ui,sans-serif}*{box-sizing:border-box}html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--label);font:16px/1.5 var(--font);-webkit-font-smoothing:antialiased}h1,h2,h3,p,ol{margin:0}a{color:var(--link)}a:hover{color:var(--link-hover)}img{display:block;max-width:100%;height:auto}.wrap{max-width:1080px;margin:0 auto;padding-left:24px;padding-right:24px}.secondary{color:var(--secondary)}.white{background:var(--surface)}.label{font-size:13px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--secondary)}h1{font-size:clamp(44px,6vw,64px);font-weight:700;line-height:1.05;letter-spacing:-1.2px}h2{font-size:clamp(32px,4vw,40px);font-weight:700;line-height:1.15;letter-spacing:-0.6px}.skip{position:absolute;left:-9999px}.skip:focus{left:16px;top:16px;z-index:1;background:var(--surface);padding:8px 12px;border-radius:8px}.nav{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding-top:16px;padding-bottom:16px}.wordmark{font-size:20px;font-weight:700;letter-spacing:-0.3px;color:var(--label);text-decoration:none}.wordmark:hover{color:var(--label)}.nav-links{display:flex;align-items:center;gap:24px}.nav-links a{display:inline-flex;align-items:center;min-height:44px;color:var(--label);text-decoration:none}.nav-links .btn-small{padding:0 18px;border-radius:12px;background:var(--link);color:#FFFFFF;font-weight:600}.nav-links .btn-small:hover{background:var(--link-hover);color:#FFFFFF}.btn{display:flex;align-items:center;justify-content:center;min-height:56px;padding:0 20px;border-radius:16px;background:var(--tint);color:#FFFFFF;text-decoration:none;font-size:20px;font-weight:700;border:0;font-family:inherit;cursor:pointer}.btn:hover{background:#0070EB;color:#FFFFFF}.btn-secondary{background:var(--surface);color:var(--link)}.btn-secondary:hover{background:var(--separator);color:var(--link-hover)}.white .btn-secondary{background:var(--bg)}.hero{display:flex;flex-wrap:wrap;align-items:center;gap:64px;padding-top:48px;padding-bottom:88px}.hero-text{flex:1 1 480px;min-width:0;display:flex;flex-direction:column;gap:20px}.subhead{font-size:21px;line-height:1.45;color:var(--secondary);max-width:520px}.hero-shot{flex:0 1 300px;min-width:0;display:flex;justify-content:center}.shot{width:300px;border-radius:40px;box-shadow:0 1px 2px rgba(0,0,0,.06),0 16px 40px rgba(0,0,0,.10)}.dl{margin-top:12px}.dl-iphone,.dl-android,.dl-other{display:none}.d-iphone .dl-desktop,.d-android .dl-desktop,.d-other .dl-desktop{display:none}.d-iphone .dl-iphone,.d-android .dl-android,.d-other .dl-other{display:flex}.js .nojs-only{display:none}.dl-phone{flex-direction:column;gap:12px;max-width:420px}.dl-phone .center{text-align:center}.dl-phone a.center{display:flex;align-items:center;justify-content:center;min-height:44px;font-size:16px}.hint{font-size:15px;color:var(--secondary)}.card{background:var(--surface);border-radius:20px;overflow:hidden}.dl-card{max-width:480px}.dl-row{display:flex;align-items:center;gap:16px;padding:16px 20px}.dl-row + .dl-row{position:relative}.dl-row + .dl-row::before{content:"";position:absolute;top:0;left:124px;right:0;border-top:1px solid var(--separator)}.dl-row .qr{flex:none;width:88px;height:88px}.row-title{font-size:17px;font-weight:600}.row-sub{font-size:15px;color:var(--secondary)}.qr{border-radius:12px;background:#FFFFFF}.qr-soon{display:flex;align-items:center;justify-content:center;border:1px dashed var(--chevron);background:var(--bg);font-size:13px;color:var(--secondary)}.nojs-only{margin-top:12px;font-size:16px}.section{padding-top:88px;padding-bottom:88px;display:flex;flex-direction:column;gap:40px}.benefits{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:40px 48px}.benefits h3{font-size:20px;font-weight:600;margin-bottom:6px}.benefits p{color:var(--secondary)}.steps{list-style:none;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;counter-reset:step}.steps li{display:flex;gap:16px;padding:20px;background:var(--surface);border-radius:20px;counter-increment:step}.steps li::before{content:counter(step);flex:none;width:32px;height:32px;border-radius:999px;background:var(--tint);color:#FFFFFF;display:flex;align-items:center;justify-content:center;font-weight:700}.steps .t{font-size:17px;font-weight:600}.steps .s{font-size:15px;line-height:1.45;color:var(--secondary);margin-top:4px}.how{gap:32px}.tagline{font-size:15px;color:var(--secondary)}.faq{max-width:760px;padding-top:0;gap:20px}.faq details + details{border-top:1px solid var(--separator)}.faq summary{display:flex;justify-content:space-between;align-items:center;gap:16px;min-height:56px;padding:12px 20px;font-size:17px;font-weight:600;cursor:pointer;list-style:none}.faq summary::-webkit-details-marker{display:none}.faq .chev{flex:none;transition:transform .2s}.faq details[open] .chev{transform:rotate(90deg)}.faq details p{padding:0 20px 18px;font-size:16px;line-height:1.55;color:var(--secondary)}.cta{padding-top:80px;padding-bottom:80px;align-items:center;text-align:center;gap:24px}.cta h2{font-size:clamp(32px,4vw,44px);letter-spacing:-0.8px}.cta .lead{font-size:19px;color:var(--secondary)}.cta .dl{margin-top:0}.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:20px}.tile{width:220px;display:flex;flex-direction:column;align-items:center;gap:10px;padding:24px;background:var(--bg);border-radius:20px}.tile .qr{width:140px;height:140px}.tile .row-sub{font-size:14px}.cta .dl-phone{width:100%}.footer{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;padding-top:24px;padding-bottom:24px;font-size:14px;color:var(--secondary)}.footer nav{display:flex;flex-wrap:wrap;gap:4px 20px}.footer a{display:inline-flex;align-items:center;min-height:44px}@media (max-width:600px){.nav{flex-wrap:nowrap}.nav-links{gap:16px}.nav-links .btn-small{padding:0 14px}.hero{gap:40px;padding-top:24px;padding-bottom:64px}.section{padding-top:64px;padding-bottom:64px}.faq{padding-top:0}}@media (max-width:420px){.wordmark{font-size:18px}}</style>
